name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:[[:space:]]*${TAG}$" cz-faktura.php || { echo "Version header does not match tag ${TAG}"; exit 1; }

      - name: Build zip
        run: |
          mkdir -p build/cz-faktura
          git archive HEAD | tar -x -C build/cz-faktura
          cd build && zip -r ../cz-faktura.zip cz-faktura

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cz-faktura.zip --title "CZ Faktura $GITHUB_REF_NAME" --notes-file CHANGELOG.md
